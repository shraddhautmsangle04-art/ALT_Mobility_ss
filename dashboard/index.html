<script>
(() => {
  const payload = JSON.parse(document.getElementById('data-payload').textContent);
  const rows = payload.rows || [];
  const generatedAt = payload.generated_at;

  // Recompute days_left and status live so they never go stale
  const today = new Date(); today.setHours(0, 0, 0, 0);
  rows.forEach(r => {
    if (r.od_end_date) {
      const end = new Date(r.od_end_date);
      if (!isNaN(end)) {
        r.days_left = Math.round((end - today) / 86400000);
        r.status = r.days_left < 0 ? 'Expired' : r.days_left <= 30 ? 'Expiring Soon' : 'Active';
      }
    }
  });

  document.getElementById('generated-at').textContent = 'Generated ' + new Date(generatedAt).toLocaleString();
  document.getElementById('total-policies').textContent = rows.length + ' policies';

  // ------ KPIs ------
  const counts = { Active: 0, 'Expiring Soon': 0, Expired: 0, Unknown: 0 };
  rows.forEach(r => { counts[r.status || 'Unknown'] = (counts[r.status || 'Unknown'] || 0) + 1; });

  const kpis = [
    { label: 'Total Policies', value: rows.length, color: 'bg-slate-900 text-white' },
    { label: 'Active', value: counts.Active || 0, color: 'bg-emerald-50 text-emerald-700 border border-emerald-200' },
    { label: 'Expiring Soon (≤30d)', value: counts['Expiring Soon'] || 0, color: 'bg-amber-50 text-amber-800 border border-amber-200' },
    { label: 'Expired', value: counts.Expired || 0, color: 'bg-rose-50 text-rose-700 border border-rose-200' },
  ];
  document.getElementById('kpis').innerHTML = kpis.map(k => `
    <div class="rounded-lg p-4 shadow-sm ${k.color}">
      <div class="text-xs uppercase tracking-wider opacity-80">${k.label}</div>
      <div class="text-3xl font-semibold mt-1">${k.value}</div>
    </div>`).join('');

  // ------ Alerts ------
  const alerts = rows
    .filter(r => r.days_left !== null && r.days_left !== undefined && r.days_left <= 30)
    .sort((a, b) => (a.days_left ?? 0) - (b.days_left ?? 0));
  document.getElementById('alerts-count').textContent = alerts.length + ' alerts';
  const alertsBody = document.getElementById('alerts-body');
  if (alerts.length === 0) {
    alertsBody.innerHTML = '<p class="text-emerald-700 text-sm">No policies are expiring within the next 30 days.</p>';
  } else {
    alertsBody.innerHTML = `
      <div class="overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead>
            <tr class="text-left text-slate-500 border-b">
              <th class="py-2 pr-4">Chassis</th>
              <th class="py-2 pr-4">Policy</th>
              <th class="py-2 pr-4">Insurer</th>
              <th class="py-2 pr-4">Expiry</th>
              <th class="py-2 pr-4">Days Left</th>
              <th class="py-2 pr-4">Status</th>
            </tr>
          </thead>
          <tbody>
            ${alerts.slice(0, 50).map(a => {
              const badge = a.days_left < 0
                ? 'bg-rose-100 text-rose-800'
                : 'bg-amber-100 text-amber-800';
              return `<tr class="border-b last:border-b-0">
                <td class="py-2 pr-4 font-mono">${a.vehicle_chassis_number ?? '—'}</td>
                <td class="py-2 pr-4 font-mono text-xs">${a.policy_number ?? '—'}</td>
                <td class="py-2 pr-4">${a.insurance_company_name ?? '—'}</td>
                <td class="py-2 pr-4">${a.od_end_date ?? '—'}</td>
                <td class="py-2 pr-4"><span class="inline-flex rounded px-2 py-0.5 text-xs ${badge}">${a.days_left}</span></td>
                <td class="py-2 pr-4">${a.status ?? '—'}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
        ${alerts.length > 50 ? `<p class="text-xs text-slate-500 mt-3">Showing first 50 of ${alerts.length}. Use the full table below to see all.</p>` : ''}
      </div>`;
  }

  // ------ Charts ------
  const statusOrder = ['Active', 'Expiring Soon', 'Expired', 'Unknown'];
  const statusColors = ['#10b981', '#f59e0b', '#ef4444', '#94a3b8'];
  new Chart(document.getElementById('status-chart'), {
    type: 'doughnut',
    data: {
      labels: statusOrder,
      datasets: [{ data: statusOrder.map(s => counts[s] || 0), backgroundColor: statusColors, borderWidth: 0 }],
    },
    options: { plugins: { legend: { position: 'bottom' } } },
  });

  const byCompany = {};
  rows.forEach(r => {
    const k = r.insurance_company_name || 'Unknown';
    byCompany[k] = (byCompany[k] || 0) + 1;
  });
  const companyEntries = Object.entries(byCompany).sort((a, b) => b[1] - a[1]).slice(0, 15);
  new Chart(document.getElementById('company-chart'), {
    type: 'bar',
    data: {
      labels: companyEntries.map(e => e[0]),
      datasets: [{ label: 'Policies', data: companyEntries.map(e => e[1]), backgroundColor: '#0f172a' }],
    },
    options: {
      indexAxis: 'y',
      plugins: { legend: { display: false } },
      scales: { x: { beginAtZero: true, ticks: { precision: 0 } } },
    },
  });

  const byMonth = {};
  rows.forEach(r => {
    if (!r.od_end_date) return;
    const d = new Date(r.od_end_date);
    if (isNaN(d)) return;
    const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    byMonth[key] = (byMonth[key] || 0) + 1;
  });
  const monthKeys = Object.keys(byMonth).sort();
  new Chart(document.getElementById('timeline-chart'), {
    type: 'bar',
    data: {
      labels: monthKeys,
      datasets: [{ label: 'Policies expiring', data: monthKeys.map(k => byMonth[k]), backgroundColor: '#6366f1' }],
    },
    options: {
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, ticks: { precision: 0 } } },
    },
  });

  // ------ Filters populate ------
  const statusSel = document.getElementById('filter-status');
  const companySel = document.getElementById('filter-company');
  statusOrder.forEach(s => {
    const o = document.createElement('option'); o.value = s; o.textContent = s; statusSel.appendChild(o);
  });
  Object.keys(byCompany).sort().forEach(c => {
    const o = document.createElement('option'); o.value = c; o.textContent = c; companySel.appendChild(o);
  });

  // ------ Data table ------
  const columns = [
    { id: 'vehicle_chassis_number', name: 'Chassis No' },
    { id: 'insurance_company_name', name: 'Insurer' },
    { id: 'policy_number', name: 'Policy No' },
    { id: 'od_start_date', name: 'OD Start' },
    { id: 'od_end_date', name: 'OD End' },
    { id: 'days_left', name: 'Days Left' },
    {
      id: 'status',
      name: 'Status',
      formatter: v => gridjs.html(statusBadge(v)),
    },
    { id: 'fire_covered', name: 'Fire' },
    { id: 'damage_coverage', name: 'Damage Coverage' },
    { id: 'premium_amount', name: 'Premium (INR)' },
    { id: 'policy_duration', name: 'Duration (Y)' },
    { id: 'policy_type', name: 'Type' },
  ];
  function statusBadge(s) {
    const color = s === 'Active' ? 'emerald' : s === 'Expiring Soon' ? 'amber' : s === 'Expired' ? 'rose' : 'slate';
    return `<span class="inline-flex rounded px-2 py-0.5 text-xs bg-${color}-100 text-${color}-800">${s ?? '—'}</span>`;
  }

  function filtered() {
    const fs = statusSel.value;
    const fc = companySel.value;
    return rows.filter(r => (!fs || r.status === fs) && (!fc || r.insurance_company_name === fc));
  }

  function toGridData(list) {
    return list.map(r => columns.map(c => r[c.id] ?? ''));
  }

  const grid = new gridjs.Grid({
    columns: columns.map(c => ({ name: c.name, formatter: c.formatter })),
    data: toGridData(rows),
    search: true,
    sort: true,
    pagination: { limit: 25, summary: true },
    resizable: true,
    style: { table: { 'font-size': '0.85rem' } },
  }).render(document.getElementById('grid'));

  const refresh = () => grid.updateConfig({ data: toGridData(filtered()) }).forceRender();
  statusSel.addEventListener('change', refresh);
  companySel.addEventListener('change', refresh);

  // ------ Excel export (multi-sheet via SheetJS) ------
  document.getElementById('export-xlsx').addEventListener('click', () => {
    const wb = XLSX.utils.book_new();
    const colIds = columns.map(c => c.id);

    // Sheet 1 — All Policies (respects active filters)
    const allData = filtered().map(r => {
      const out = {};
      colIds.forEach(k => { out[k] = r[k] ?? ''; });
      return out;
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(allData), 'All Policies');

    // Sheet 2 — Expiry Alerts (<=30 days)
    const alertData = rows
      .filter(r => r.days_left !== null && r.days_left !== undefined && r.days_left <= 30)
      .sort((a, b) => a.days_left - b.days_left)
      .map(r => { const o = {}; colIds.forEach(k => { o[k] = r[k] ?? ''; }); return o; });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(alertData), 'Expiry Alerts (<=30d)');

    // Sheet 3 — By Status
    const statusMap = {};
    rows.forEach(r => {
      const s = r.status || 'Unknown';
      if (!statusMap[s]) statusMap[s] = { status: s, policies: 0, total_premium: 0 };
      statusMap[s].policies++;
      statusMap[s].total_premium += parseFloat(r.premium_amount) || 0;
    });
    XLSX.utils.book_append_sheet(wb,
      XLSX.utils.json_to_sheet(Object.values(statusMap).sort((a,b) => b.policies - a.policies)),
      'By Status');

    // Sheet 4 — By Insurer
    const insMap = {};
    rows.forEach(r => {
      const k = r.insurance_company_name || 'Unknown';
      if (!insMap[k]) insMap[k] = { insurance_company_name: k, policies: 0, total_premium: 0 };
      insMap[k].policies++;
      insMap[k].total_premium += parseFloat(r.premium_amount) || 0;
    });
    Object.values(insMap).forEach(v => { v.avg_premium = +(v.total_premium / v.policies).toFixed(2); });
    XLSX.utils.book_append_sheet(wb,
      XLSX.utils.json_to_sheet(Object.values(insMap).sort((a,b) => b.policies - a.policies)),
      'By Insurer');

    // Sheet 5 — By Policy Type
    const typeMap = {};
    rows.forEach(r => {
      const k = (r.policy_type || 'Unknown') + '|' + (r.policy_duration || '');
      if (!typeMap[k]) typeMap[k] = { policy_type: r.policy_type, policy_duration: r.policy_duration, policies: 0, total_premium: 0 };
      typeMap[k].policies++;
      typeMap[k].total_premium += parseFloat(r.premium_amount) || 0;
    });
    XLSX.utils.book_append_sheet(wb,
      XLSX.utils.json_to_sheet(Object.values(typeMap).sort((a,b) => b.policies - a.policies)),
      'By Policy Type');

    // Sheet 6 — By Expiry Month
    const monthMap = {};
    rows.forEach(r => {
      if (!r.od_end_date) return;
      const m = r.od_end_date.slice(0, 7);
      if (!monthMap[m]) monthMap[m] = { expiry_month: m, policies: 0 };
      monthMap[m].policies++;
    });
    XLSX.utils.book_append_sheet(wb,
      XLSX.utils.json_to_sheet(Object.keys(monthMap).sort().map(k => monthMap[k])),
      'By Expiry Month');

    XLSX.writeFile(wb, 'alt_mobility_insurance_dashboard.xlsx');
  });
})();
</script>
</body>
</html>
