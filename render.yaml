services:
  - type: web
    name: alt-mobility-ss
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_FALLBACK_MODEL
        value: gpt-4o
      - key: GITHUB_TOKEN
        sync: false
      - key: GIT_BRANCH
        value: feat/api-incremental-upload
      - key: GIT_REMOTE_URL
        value: https://github.com/shraddhautmsangle04-art/ALT_Mobility_ss.git
      - key: GIT_USER_NAME
        value: ALT Mobility Bot
      - key: GIT_USER_EMAIL
        value: bot@altmobility.local
      - key: PYTHON_VERSION
        value: 3.12.3
